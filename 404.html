<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada · Pedro [SOBRENOME]</title>
    <style>
        :root { --primary: #1A2F5C; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
            background: #fff;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }
        .box { max-width: 420px; }
        .code {
            font-size: clamp(3rem, 12vw, 6rem);
            font-weight: 200;
            letter-spacing: 0.1em;
            color: var(--primary);
            line-height: 1;
        }
        h1 {
            font-size: 1.1rem;
            font-weight: 400;
            margin: 16px 0 8px;
            color: var(--primary);
            letter-spacing: 0.02em;
        }
        p { color: #767676; font-size: 0.9rem; margin-bottom: 24px; }
        a {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">404</div>
        <h1>Página não encontrada</h1>
        <p>A página que procura não existe ou foi movida.<br />Page not found.</p>
        <a href="/" id="home">Voltar ao início / Home</a>
    </div>
    <script>
        // Aponta o botão para a raiz do site (funciona em projeto ou domínio próprio)
        (function () {
            var seg = location.pathname.split('/').filter(Boolean);
            // Em GitHub Pages de projeto, o 1.º segmento é o nome do repositório
            if (location.hostname.endsWith('github.io') && seg.length > 0) {
                document.getElementById('home').href = '/' + seg[0] + '/';
            }
        })();
    </script>
</body>
</html>
